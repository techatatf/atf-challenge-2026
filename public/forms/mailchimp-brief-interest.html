<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brief Interest form</title>
    <link
      href="https://cdn-images.mailchimp.com/embedcode/classic-061523.css"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }

      #mc_embed_signup {
        width: 100%;
        background: #fff;
        color: #171717;
        font: 14px Arial, sans-serif;
      }

      #mc_embed_signup form {
        margin: 0;
        padding: 24px;
      }

      #mc_embed_signup .button {
        background: #e63946;
      }

      #mc_embed_signup .button:hover {
        background: #c92f3b;
      }
    </style>
  </head>
  <body>
    <div id="mc_embed_signup">
      <form
        action="https://africantechnologyforum.us20.list-manage.com/subscribe/post?u=42625c20297b34e120b6e10e5&amp;id=4110193ca4&amp;f_id=00ee9eeef0"
        method="post"
        id="mc-embedded-subscribe-form"
        name="mc-embedded-subscribe-form"
        class="validate"
        target="mc_embed_redirect_frame"
      >
        <div id="mc_embed_signup_scroll">
          <h2>About You</h2>
          <div class="indicates-required">
            <span class="asterisk">*</span> indicates required
          </div>

          <div class="mc-field-group">
            <label for="mce-FNAME">First Name <span class="asterisk">*</span></label>
            <input id="mce-FNAME" type="text" name="FNAME" class="required text" required />
          </div>
          <div class="mc-field-group">
            <label for="mce-LNAME">Last Name <span class="asterisk">*</span></label>
            <input id="mce-LNAME" type="text" name="LNAME" class="required text" required />
          </div>
          <div class="mc-field-group">
            <label for="mce-COMPANY">Organization Name <span class="asterisk">*</span></label>
            <input id="mce-COMPANY" type="text" name="COMPANY" class="required text" required />
          </div>
          <div class="mc-field-group">
            <label for="mce-MMERGE10">Job Title <span class="asterisk">*</span></label>
            <input id="mce-MMERGE10" type="text" name="MMERGE10" class="required text" required />
          </div>
          <div class="mc-field-group">
            <label for="mce-MMERGE8">Country</label>
            <input id="mce-MMERGE8" type="text" name="MMERGE8" />
          </div>
          <div class="mc-field-group">
            <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
            <input id="mce-EMAIL" type="email" name="EMAIL" class="required email" required />
          </div>
          <div class="mc-field-group">
            <label for="mce-PHONE">Phone Number (optional)</label>
            <input id="mce-PHONE" type="text" name="PHONE" />
          </div>
          <div class="mc-field-group">
            <label for="mce-MMERGE13">Sector or Industry <span class="asterisk">*</span></label>
            <select id="mce-MMERGE13" name="MMERGE13" class="required" required>
              <option value="">Select a sector</option>
              <option value="Health">Health</option>
              <option value="Education">Education</option>
              <option value="Agriculture">Agriculture</option>
              <option value="Mining &amp; Manufacturing">Mining &amp; Manufacturing</option>
              <option value="Finance">Finance</option>
              <option value="Government">Government</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div hidden><input type="hidden" name="tags" value="4329195" /></div>
          <div aria-hidden="true" style="position: absolute; left: -5000px">
            <input
              type="text"
              name="b_42625c20297b34e120b6e10e5_4110193ca4"
              tabindex="-1"
              value=""
            />
          </div>
          <div class="clear">
            <input
              type="submit"
              name="subscribe"
              id="mc-embedded-subscribe"
              class="button"
              value="Submit"
            />
          </div>
        </div>
      </form>
    </div>

    <iframe
      name="mc_embed_redirect_frame"
      id="mc_embed_redirect_frame"
      hidden
      title="Mailchimp response"
    ></iframe>

    <script>
      (() => {
        const form = document.getElementById("mc-embedded-subscribe-form");
        const responseFrame = document.getElementById("mc_embed_redirect_frame");
        let awaitingResponse = false;

        form.addEventListener("submit", () => {
          awaitingResponse = true;
        });

        responseFrame.addEventListener("load", () => {
          if (!awaitingResponse) return;
          awaitingResponse = false;
          window.parent.postMessage(
            { type: "brief-interest-response" },
            window.location.origin,
          );
        });
      })();
    </script>
    <script src="https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
    <script>
      window.fnames = ["EMAIL", "FNAME", "LNAME"];
      window.ftypes = ["email", "text", "text"];
      window.$mcj = jQuery.noConflict(true);
    </script>
  </body>
</html>
